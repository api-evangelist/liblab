  - type: SampleAPI
    url: https://github.com/liblaber/simple-petstore-openapi
- aid: liblab:mcp-generator
  name: Liblab MCP Generator
  description: >-
    Generates a complete Model Context Protocol (MCP) server from an OpenAPI, Swagger, or Postman spec
    so AI chat clients (Claude, Cursor, OpenAI) can call the underlying API in natural language. Launched
    June 2025; first-year free tier covers 100 MCP calls per month, then $5 per 100 calls.
  humanURL: https://liblab.com/blog/mcp-generator
  tags:
  - MCP
  - AI Agents
  - OpenAPI
  tags_raw:
  - MCP
  - AI Agents
  - Model Context Protocol
  - OpenAPI
  properties:
