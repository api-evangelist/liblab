description: liblab generates and publishes type-safe, idiomatic SDKs in TypeScript, Python, Java, .NET, Go, PHP, and Terraform from OpenAPI/Swagger/Postman
  specs, plus MCP servers that expose those APIs to AI agents. The platform ships a CLI, hosted portal, and CI/CD GitHub Action that publish SDKs
  to customer repos via pull requests. liblab joined Postman in November 2025 to complete the API lifecycle. It offers a unified developer experience
  with extensive documentation, pricing transparency, and community support.

