apis:
- aid: liblab:liblab
  name: Liblab SDK Generator
  description: >-
    Cloud-based generator that produces customizable, type-safe SDKs in seven target stacks (TypeScript,
    Python, Java, .NET, Go, PHP, Terraform) from OpenAPI 2.0/3.0/3.1 or Postman Collections. CLI and CI/CD
    workflows publish SDKs to customer GitHub repos as pull requests.
  humanURL: https://liblab.com/
  tags:
  - SDK Generation
  - Code Generation
  - OpenAPI
  - CLI
  - CI/CD
