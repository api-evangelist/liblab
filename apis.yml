  - type: BlogPost
    url: https://liblab.com/blog/mcp-generator
  - type: Pricing
    url: https://liblab.com/pricing
- aid: liblab:hub
  name: Liblab Hub
  description: >-
    Public catalog of pre-generated SDKs (Python, TypeScript, C#, PHP) for popular third-party APIs (Postman,
    RingCentral, NYT, UPS, NHL, Pinnacle, OpenHue, Skyscanner, Voyado, Booking, etc.) used to demonstrate
    generator output quality. Free to use.
  humanURL: https://hub.liblab.com/
