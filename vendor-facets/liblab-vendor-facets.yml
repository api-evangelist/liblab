# Vendor facets — liblab. SDK, Terraform and MCP generation from OpenAPI, plus generated SDK and
# API docs. The headline: SDK pointers and a docs pointer, with an MCP server that liblab hosts on
# its own domain (mcp.liblab.io/<project>). That server is not on the provider's surface, so it
# scores `platform` at best. Spec validation reports only and cannot move Contract Quality.
vendor: liblab
name: liblab
website: https://liblab.com
areas:
- sdk-generation
registry_keys: []
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  liblab lifts the SDK pointers (six languages) and, if the provider uses its docs product, the documentation
  and reference pointers. Each counts once declared in apis.yml. Its MCP generator deploys to liblab's
  own host (mcp.liblab.io/<project>), not the provider's, so it earns the `platform` grade (0.25) at most.
  Its code snippets reach only the Code Samples link fallback on openapi_examples. Spec validation, bundling
  and merging leave the contract's content as it was. Outside the MCP URL, liblab SDKs look like the provider's
  own.
features:
- id: sdk-generation
  name: SDK code generator
  description: >-
    SDKs for C#, TypeScript, PHP, Java, Go and Python generated from OpenAPI, Swagger or Postman input,
    with CI/CD and package release automation.
  source: https://liblab.com/
  tier: paid
- id: mcp-generator
  name: MCP generator
  description: >-
    Enabling MCP in the project config deploys a generated MCP server to liblab's servers at a URL like
    https://mcp.liblab.io/<project-name>.
  source: https://liblab.com/products/mcp
  tier: paid
- id: docs-generation
  name: SDK and API documentation
  description: >-
    Generated SDK docs and API docs with SDK code snippets for authentication and every method, or snippets
    embedded in Redocly, Mintlify or ReadMe.
  source: https://liblab.com/products/documentation
  tier: paid
- id: terraform-generation
  name: Terraform provider generation
  description: Generates a Terraform provider with custom hooks, registry publishing and generated docs.
  source: https://liblab.com/products/terraform-generation-provider
  tier: paid
- id: spec-management
  name: API spec management
  description: Validates a spec against conventions, bundles external references and merges multiple specs.
  source: https://liblab.com/products/api-spec-management
  tier: all
- id: postman-input
  name: Postman collection input
  description: Accepts a Postman collection as the input for generation.
  source: https://liblab.com/docs
  tier: all
maps:
- feature: sdk-generation
  check: sdk_count_1
  layer: composite
  provider_must: Publish a generated SDK and declare it as an SDK entry in apis.yml.
  catalog_pass_rate: 0.148
  facet: developer_ergonomics
  points: 3
  baseline_pass_rate: 0.413
- feature: sdk-generation
  check: sdk_count_3
  layer: composite
  provider_must: Publish three or more language SDKs and declare each as its own SDK entry.
  catalog_pass_rate: 0.018
  facet: developer_ergonomics
  points: 4
  baseline_pass_rate: 0.043
- feature: docs-generation
  check: documentation_present
  layer: composite
  provider_must: Publish the generated SDK docs and declare them as a Documentation entry.
  catalog_pass_rate: 0.453
  facet: developer_ergonomics
  points: 4
  baseline_pass_rate: 0.95
  saturated: true
  saturated_note: >-
    95% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
- feature: docs-generation
  check: api_reference_present
  layer: composite
  provider_must: Publish the generated API docs and declare them as an APIReference entry.
  catalog_pass_rate: 0.222
  facet: developer_ergonomics
  points: 3
  baseline_pass_rate: 0.942
  saturated: true
  saturated_note: >-
    94% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
- feature: docs-generation
  check: examples_published
  layer: composite
  provider_must: Declare the snippet-bearing docs as a CodeSamples entry.
  catalog_pass_rate: 0.052
  facet: contract_quality
  points: 4
  baseline_pass_rate: 0.127
- feature: docs-generation
  check: openapi_examples
  layer: agent_readiness
  grade: documented
  partial: true
  partial_note: >-
    SDK code snippets are not request/response examples in the contract, so only the Code Samples link
    fallback (0.25) is reached.
  points: 7
  baseline_pass_rate: 0.36
- feature: mcp-generator
  check: mcp_server
  layer: agent_readiness
  grade: platform
  provider_must: Declare the server in the provider's mcp/ manifest.
  note: >-
    The server is deployed on liblab's shared host, not the provider's, and one generator template serves
    every customer. That is the pattern 0.22.0 grades `platform` (0.25). The source does not say whether
    tools are per operation.
  points: 12
  baseline_pass_rate: 0.22
- feature: spec-management
  check: operations_operation_ids
  layer: composite
  conditional: true
  condition: >-
    Validation reports convention failures. The provider has to fix and republish the contract, and the
    API has to support what is added.
  catalog_pass_rate: 0.827
  facet: contract_quality
  points: 4
  baseline_pass_rate: 0.918
  saturated: true
  saturated_note: >-
    92% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
earns_nothing:
- feature: docs-generation
  check: examples_present
  why: SDK snippets in docs are not request or response examples in the OpenAPI.
- feature: postman-input
  check: postman_present
  why: liblab reads a Postman collection as input. It does not publish one.
- feature: sdk-generation
  check: idempotency
  layer: agent_readiness
  why: SDK generation does not add an idempotency key to the contract.
out_of_reach:
  checks:
  - cli_present
  - llms_txt_published
  - agent_skills
  - agent_skill_present
  - contract_present
  - change_log_present
  - status_page_present
  - well_known_published
  - overlay_published
  note: >-
    None of the product pages fetched show a CLI generator for the customer's API, an llms.txt, Agent
    Skills or overlay output. The liblab CLI is the tool that drives generation.
unscored_practice:
- feature: terraform-generation
  why: A generated Terraform provider is a real integration surface that no check reads.
surface:
  contract_quality:
    reachable: 8.0
    total: 211
  developer_ergonomics:
    reachable: 14.0
    total: 42
  agent_readiness:
    reachable: 4.8
    total: 139
hard_rule: >-
  A model, not a score. Adopting this vendor changes a provider's Kin Score only when the provider publishes
  the resulting artifacts on its own surface; nothing here writes a score, and no sponsorship or partnership
  can.
