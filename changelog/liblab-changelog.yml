- breaking: false
  highlights:
  - We're thrilled to share some major developments this month, including the launch of our new free tier, the release of liblab Hub, the introduction
    of the Java v2 SDK Generator, and the upcoming end of support for our v1 SDK Generators.
  - We’re excited to announce the launch of liblab hub - a free collection of SDKs and SDK documentation generated by liblab for popular APIs.
  - Now, all organizations can generate up to 5 SDKs per month, free of charge.
  - Java v2 is now the default option for Java SDK generation.
  date: '2024-08-01'
- breaking: false
  highlights:
  - The C# and Go SDKs are now generally available, bringing enterprise‑grade stability and advanced features to your SDK generation process.
  - Native OAuth support is now available for the C# SDK, enhancing API authentication with secure token management.
  - Streaming support is now available for both Python and TypeScript SDKs, designed to enhance real‑time data processing for AI‑based applications.
  - We've redesigned the liblab Developer Dashboard to make generating and managing SDKs easier and more intuitive.
  date: '2024-12-01'
- breaking: false
  highlights:
  - Introducing our Postman integration for instant SDK generation, transforming collections into developer‑friendly SDKs.
  - Resolved Go SDK nullable field unmarshalling to properly distinguish between null and undefined values.
  - Launched the MCP Generator with support for custom hostnames, enabling conversational AI interactions with APIs.
  date: '2025-08-01'
